<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vesper</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230C0C0C'/%3E%3Cpath d='M3 4l4 4-4 4' stroke='%23CCCCCC' stroke-width='1.6' fill='none'/%3E%3Cpath d='M8 12h5' stroke='%23CCCCCC' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="tabbar">
      <div class="tabs">
        <a class="home" href="/" aria-label="全部会话">≡</a>
        <div class="tab active"><span id="dot" class="dot"></span><span id="title">Vesper</span></div>
      </div>
      <div id="status" class="status" role="status"></div>
    </header>
    <main id="terminal" hidden></main>
    <main id="picker" class="picker" hidden>
      <form id="create" class="create">
        <label>Shell <select id="shell" name="shell"></select></label>
        <label class="grow">目录 <input id="cwd" name="cwd" autocomplete="off" spellcheck="false" /></label>
        <button type="submit">新建</button>
      </form>
      <p id="message" class="message" role="status"></p>
      <ul id="sessions" class="sessions"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
